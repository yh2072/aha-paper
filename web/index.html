<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aha-paper · 带你读一遍论文</title><link rel="stylesheet" href="/assets/studio.css?v=refine9"><link rel="stylesheet" href="/assets/home.css?v=refine9"><link rel="stylesheet" href="/assets/refine.css?v=refine9"></head><body class="aha-home">
<aside class="sidebar"><a class="home-brand" href="/"><span class="home-mark">✳</span><strong>aha-paper</strong></a><nav><button class="nav active" id="homeNav"><span><img class="emoji" src="/assets/emoji/1f3e0.svg" alt=""></span> 首页</button><button class="nav" data-view="all"><span><img class="emoji" src="/assets/emoji/1f4c4.svg" alt=""></span> 我的论文 <i id="allNav">0</i></button><button class="nav" data-view="done"><span><img class="emoji" src="/assets/emoji/25b6.svg" alt=""></span> 深度讲解 <i id="doneNav">0</i></button><div class="nav-divider"></div><button class="nav" id="settingsNav"><span><img class="emoji" src="/assets/emoji/2699.svg" alt=""></span> 模型与声音</button></nav><div class="home-side-note"><span>从一篇论文，<br>到真正的理解。</span><small>读懂 · 看见 · 亲手发现</small></div><div class="local-account"><span class="local-avatar">本</span><div><b>本地工作区</b><small><i class="status-dot"></i>文件保存在你的电脑</small></div></div></aside>
<main class="home-main"><header class="topbar" data-lang-slot><span>逐句对照论文</span><button class="connection" id="connection"><span class="status-dot"></span><span id="connectionText">读取配置中</span><span>↗</span></button></header>
<section class="home-start"><h1>像有人<span>带着你读论文。</span></h1><p class="home-subtitle">讲到哪一句，就在论文原文上标出哪一句；讲到哪张图，光标就移到图上。</p>
<div class="paper-composer" id="paperDrop"><textarea id="creationPrompt" maxlength="2000" placeholder="上传论文，或先告诉我你想重点弄懂什么……&#10;比如：讲清实验设计、带我读懂关键主图，并区分结论和局限。" aria-label="讲解重点"></textarea><div id="attachmentList" class="attachment-list"></div><div class="composer-bar"><div class="composer-tools"><label class="attach-paper" for="paperInput"><span>＋</span> 添加论文</label><input id="paperInput" type="file" accept=".pdf,application/pdf" multiple hidden><label class="composer-time"><img class="emoji" src="/assets/emoji/23f1.svg" alt=""><input id="targetMinutes" type="number" inputmode="numeric" min="3" max="30" step="1" placeholder="自动" list="minutePresets" aria-label="讲解时长"><span>分钟</span></label><datalist id="minutePresets"><option value="5"></option><option value="8"></option><option value="11"></option><option value="15"></option><option value="20"></option><option value="30"></option></datalist><span class="composer-chip">◈ 逐句讲解</span><span class="composer-chip">16:9 可交互</span></div><button id="createExplain" class="composer-submit" disabled>生成讲解 <span><img class="emoji" src="/assets/emoji/2b06.svg" alt=""></span></button></div></div>
<div class="composer-footnote"><span>支持 PDF · 可批量添加 · 保留论文原图和数据出处</span><button id="openSettingsInline">配置 API ↗</button></div>
<div class="starter-prompts"><span id="starterPrompts" data-no-i18n></span><button class="prompt-manage" id="managePrompts">＋ 我的预设</button></div></section>
<section class="library"><div class="library-heading"><div><h2 id="collectionTitle">最近项目 <span id="projectCount">0</span></h2></div><div class="library-tools"><input id="search" placeholder="搜索论文或讲解…" aria-label="搜索作品"><button class="small-button" id="refresh"><img class="emoji" src="/assets/emoji/1f504.svg" alt=""></button><button class="view-all" id="viewAll">查看全部 ↗</button></div></div><div id="projects" class="projects" aria-live="polite"></div><div id="empty" class="empty" hidden><span>✳</span><h3>还没有讲解。</h3><p>添加一篇 PDF，它会按原文逐句讲一遍。</p><button class="small-button" id="emptyUpload">添加论文 ↗</button></div></section>
<section class="home-explore"><div class="explore-grid"><button class="explore-card explore-figure" data-prompt-id="figures"><span class="explore-art">◈</span><small>讲解方式</small><h3>带读主图，<br>而不是只念结论。</h3><p>论文原图 · 局部放大 · 随讲解移动的光标</p><b>用这个方式生成 ↗</b></button></div></section><footer><span>aha-paper</span><span>每一句讲解，都指向论文里的一句原文。</span></footer></main>
<dialog id="modal"><button class="close-modal" id="closeModal" aria-label="关闭"><img class="emoji" src="/assets/emoji/2716.svg" alt=""></button><div id="modalBody"></div></dialog><div class="toast" id="toast" role="status"></div><script src="/assets/i18n.js?v=refine9" defer></script><script src="/assets/studio.js?v=refine9" defer></script></body></html>
