name: CI

# Pull requests and the default branch. Nothing here needs a credential: the
# suite never reaches a model provider, which is also why it can run on a fork.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # ffmpeg is a real dependency of the suite, not a nicety: explainer.build
      # concatenates the narration with it, and app/bin.py's resolution tests
      # ask the OS where it is. Installed from each platform's own package
      # manager rather than a third-party action, so the only actions this
      # workflow trusts are GitHub's own.
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          else
            brew install ffmpeg
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.txt
      # The model catalogue is served by a Node bridge (scripts/pi-models.mjs),
      # so the suite needs its one runtime dependency or seventeen tests fail on
      # ERR_MODULE_NOT_FOUND. --omit=dev leaves out electron and
      # electron-builder: ~200 MB that only the desktop build touches.
      # --ignore-scripts is what the README's own setup uses, and it keeps
      # electron's postinstall from downloading a browser we never run.
      - run: npm ci --ignore-scripts --omit=dev
      # unittest, not pytest: the suite is stdlib and the project does not
      # depend on a test runner it would then have to pin.
      - run: python -m unittest discover -s tests -q

  translations:
    # The interface is bilingual by contract, not by habit. A Chinese error
    # string added without its English twin fails here rather than appearing in
    # an English interface three releases later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_translations.py
